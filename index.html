<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        h1 { text-align: center; }
        .container { max-width: 600px; margin: auto; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; }
        button { padding: 10px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #fff; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; }
        .remove { background-color: #ff4c4c; color: #fff; border: none; cursor: pointer; }
        .remove:hover { background-color: #ff1f1f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button id="addTaskBtn">Add Task</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        // Load tasks from local storage
        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        tasks.forEach(task => {
            addTaskToList(task);
        });

        // Adding new task
        addTaskBtn.addEventListener('click', () => {
            const task = taskInput.value;
            if (task) {
                tasks.push(task);
                localStorage.setItem('tasks', JSON.stringify(tasks));
                addTaskToList(task);
                taskInput.value = '';
            }
        });

        // Function to add a task to the list
        function addTaskToList(task) {
            const li = document.createElement('li');
            li.textContent = task;
            const removeBtn = document.createElement('button');
            removeBtn.textContent = 'Remove';
            removeBtn.classList.add('remove');
            removeBtn.addEventListener('click', () => {
                const index = tasks.indexOf(task);
                if (index > -1) {
                    tasks.splice(index, 1);
                    localStorage.setItem('tasks', JSON.stringify(tasks));
                    taskList.removeChild(li);
                }
            });
            li.appendChild(removeBtn);
            taskList.appendChild(li);
        }
    </script>
</body>
</html>
